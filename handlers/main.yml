---
# handlers/main.yml

- name: reload_systemd
  systemd:
    daemon_reload: yes

- name: restart_postgresql
  service:
    name: "{{ pg_service }}"
    state: restarted

- name: restart_tomcat
  service:
    name: "{{ tomcat_service }}"
    state: restarted

- name: restart_activemq
  service:
    name: "{{ activemq_service }}"
    state: restarted

- name: restart_solr
  service:
    name: "{{ solr_service }}"
    state: restarted

- name: restart_transform
  service:
    name: "{{ transform_service }}"
    state: restarted

- name: restart_nginx
  service:
    name: "{{ nginx_service }}"
    state: restarted
